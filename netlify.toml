[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Known club pages are static files under /club/{id}/index.html (generated at build).
# Unknown /club/* paths get a real HTTP 404 (static files take precedence over redirects).
# Preferred URL shape is /club/{id} via canonical + sitemap (no forced 301 hop).
[[redirects]]
  from = "/club/*"
  to = "/404.html"
  status = 404

# Hidden SEO docs (static HTML in publish dir). Canonical trailing slash.
# Do not let these fall through to the SPA rewrite below.
[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/how-to-find"
  to = "/how-to-find/"
  status = 301

# SPA fallback for app routes (search query strings, etc.).
# Existing static files (about/, how-to-find/, club pages, llms.txt) take precedence.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/*"
  [headers.values]
    # Allow iframe embeds only on the official MDIO site (+ local hub). Not *.rsamdio.org.
    # Prefer CSP frame-ancestors over X-Frame-Options (ALLOW-FROM is obsolete; DENY would block embeds).
    Content-Security-Policy = "frame-ancestors 'self' https://rsamdio.org https://www.rsamdio.org http://localhost:3000 http://127.0.0.1:3000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    Cross-Origin-Opener-Policy = "same-origin"
